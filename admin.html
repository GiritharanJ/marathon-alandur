<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Admin - Marathon 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Anek+Tamil:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
.wrap{max-width:1100px;margin:0 auto;padding:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.stat{background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--blue);border-radius:10px;padding:10px 14px}
.stat b{display:block;font-size:26px}.stat.g{border-left-color:var(--green)}.stat.r{border-left-color:var(--red)}.stat.y{border-left-color:#e0b800}.stat.p{border-left-color:var(--purple)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.bar input,.bar select{width:auto;flex:1;min-width:140px}
.tabs button,.sm{padding:8px 14px;border:1.5px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink);font:inherit;cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--paper)}
.tw{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tag{padding:2px 9px;border-radius:99px;color:#fff;font-size:12px}.pending,.new{background:#c98a00}.confirmed{background:var(--green)}.rejected,.declined{background:var(--red)}.contacted{background:var(--blue)}
.sm{padding:4px 10px;font-size:13px}
#login{max-width:340px;margin:80px auto}
</style></head><body>
<div id="login" class="card"><h2>Admin login</h2>
<label>Email<input id="em" type="email" autocomplete="username"></label>
<label>Password<input id="pw" type="password" autocomplete="current-password"></label>
<div id="lerr" class="err"></div><button class="btn" id="lb">Log in</button></div>
<div id="app" class="wrap" hidden>
<div class="bar" style="justify-content:space-between;align-items:center"><h2 style="margin:0">Marathon 2026 dashboard</h2><button class="sm" id="out">Log out</button></div>
<div class="stats" id="stats"></div>
<div class="tabs bar"><button id="t1" class="on">Runners</button><button id="t2">Sponsors</button><button class="sm" id="csv" style="margin-left:auto">Export CSV</button></div>
<div class="bar"><input id="q" placeholder="Search name, mobile, area, reg no"><select id="st"><option value="">All status</option></select><select id="ag"><option value="">All age groups</option><option>6-13</option><option>13-17</option><option>18-40</option><option>40+</option></select></div>
<div class="tw"><table><thead id="th"></thead><tbody id="tb"></tbody></table></div></div>
<script src="app.js"></script>
<script>
const $=id=>document.getElementById(id);let tab="reg",regs=[],spns=[];
const money=n=>"₹"+Number(n||0).toLocaleString("en-IN");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function signed(url){ // bucket is read via admin session
  const p=url.split("/uploads/")[1];const {data}=await sb.storage.from("uploads").createSignedUrl(p,3600);return data?.signedUrl||url}
async function open_(u){window.open(await signed(u),"_blank")}
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  $("login").hidden=!!session;$("app").hidden=!session;if(session)load()}
$("lb").onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$("em").value,password:$("pw").value});
  if(error)$("lerr").textContent=error.message;else boot()};
$("out").onclick=async()=>{await sb.auth.signOut();boot()};
async function load(){
  [regs,spns]=await Promise.all([sb.from("registrations").select("*").order("created_at",{ascending:false}).then(r=>r.data||[]),
    sb.from("sponsors").select("*").order("created_at",{ascending:false}).then(r=>r.data||[])]);
  stats();render()}
function stats(){
  const c=regs.filter(r=>r.status==="confirmed"),ag=k=>c.filter(r=>r.age_group===k).length;
  const sp=spns.filter(s=>s.status==="confirmed").reduce((a,s)=>a+Number(s.amount||0),0);
  $("stats").innerHTML=[["","Registrations",regs.length],["y","Pending",regs.filter(r=>r.status==="pending").length],["g","Confirmed",c.length],
   ["g","Runner fees",money(c.length*300)],["p","Sponsors",spns.length],["p","Sponsor funds",money(sp)],
   ["","6-13 / 13-17",ag("6-13")+" / "+ag("13-17")],["","18-40 / 40+",ag("18-40")+" / "+ag("40+")]]
   .map(([k,l,v])=>`<div class="stat ${k}">${l}<b>${v}</b></div>`).join("")}
function setTab(t){tab=t;$("t1").classList.toggle("on",t==="reg");$("t2").classList.toggle("on",t==="spn");
  $("ag").hidden=t==="spn";$("st").innerHTML='<option value="">All status</option>'+(t==="reg"?["pending","confirmed","rejected"]:["new","contacted","confirmed","declined"]).map(s=>`<option>${s}</option>`).join("");render()}
$("t1").onclick=()=>setTab("reg");$("t2").onclick=()=>setTab("spn");["q","st","ag"].forEach(i=>$(i).oninput=render);
function rows(){const q=$("q").value.toLowerCase(),st=$("st").value,ag=$("ag").value;
  return(tab==="reg"?regs:spns).filter(r=>(!st||r.status===st)&&(tab==="spn"||!ag||r.age_group===ag)&&(!q||JSON.stringify(Object.values(r)).toLowerCase().includes(q)))}
function render(){
  const R=rows();
  if(tab==="reg"){$("th").innerHTML="<tr><th>Reg No</th><th>Name</th><th>Age</th><th>Gender</th><th>Mobile</th><th>Area</th><th>T-shirt</th><th>Health</th><th>Proof</th><th>Status</th><th>Action</th></tr>";
   $("tb").innerHTML=R.map(r=>`<tr><td>${r.reg_no||"-"}</td><td>${esc(r.full_name)}</td><td>${r.age_group}</td><td>${r.gender}</td><td><a href="https://wa.me/91${r.whatsapp||r.mobile}" target="_blank">${r.mobile}</a></td><td>${esc(r.area)}</td><td>${r.tshirt}</td><td>${esc(r.health)}</td><td><button class="sm" onclick="open_('${r.screenshot_url}')">View</button></td><td><span class="tag ${r.status}">${r.status}</span></td><td><button class="sm" onclick="setS('registrations','${r.id}','confirmed')">Confirm</button> <button class="sm" onclick="setS('registrations','${r.id}','rejected')">Reject</button></td></tr>`).join("")}
  else{$("th").innerHTML="<tr><th>Organisation</th><th>Contact</th><th>Mobile</th><th>Tier</th><th>Amount</th><th>Message</th><th>Proof</th><th>Status</th><th>Action</th></tr>";
   $("tb").innerHTML=R.map(r=>`<tr><td>${esc(r.org_name)}</td><td>${esc(r.contact_name)}</td><td>${r.mobile}</td><td>${r.tier}</td><td>${money(r.amount)}</td><td>${esc(r.message)}</td><td>${r.proof_url?`<button class="sm" onclick="open_('${r.proof_url}')">View</button>`:"-"}</td><td><span class="tag ${r.status}">${r.status}</span></td><td><button class="sm" onclick="setS('sponsors','${r.id}','contacted')">Contacted</button> <button class="sm" onclick="setS('sponsors','${r.id}','confirmed')">Confirm</button></td></tr>`).join("")}
  if(!R.length)$("tb").innerHTML='<tr><td colspan="11">Nothing here yet.</td></tr>'}
async function setS(t,id,s){const {error}=await sb.from(t).update({status:s}).eq("id",id);if(error)alert(error.message);else load()}
$("csv").onclick=()=>{const R=rows();if(!R.length)return;const k=Object.keys(R[0]);
  const c=[k.join(",")].concat(R.map(r=>k.map(x=>'"'+String(r[x]??"").replace(/"/g,'""')+'"').join(","))).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+c],{type:"text/csv"}));a.download=tab+".csv";a.click()};
setTab("reg");boot();
</script></body></html>
