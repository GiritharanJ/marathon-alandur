<!doctype html><html lang="ta"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sponsor - போதை விழிப்புணர்வு மாரத்தான் 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Anek+Tamil:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script></head>
<body>
<header class="hero"><p class="brand">CHENNAI MARATHON FRIENDS</p>
<h1 class="title">ஸ்பான்சர் ஆகுங்கள்<br><b>Run for a Better Tomorrow</b></h1>
<p class="sub">Drugs kill dreams. Stand with Alandur's runners on 31 Oct 2026.</p></header>
<nav><a href="index.html">← Runner registration</a></nav>
<main>
<form id="f" class="card" novalidate>
<h2>Choose a sponsorship</h2>
<!-- EDIT tier names and amounts to your real packages -->
<div class="tiers">

  <label>
    <input type="radio" name="tier" value="Title Sponsor|100000" required>
    <span>
      <b>Title Sponsor – ₹1,00,000</b><br>
      <small>Name on banner, T-shirt and stage</small>
    </span>
  </label>

  <label>
    <input type="radio" name="tier" value="Gold|50000">
    <span>
      <b>Gold Sponsor – ₹50,000</b><br>
      <small>Logo on T-shirt and main banners</small>
    </span>
  </label>

  <label>
    <input type="radio" name="tier" value="Silver|25000">
    <span>
      <b>Silver Sponsor – ₹25,000</b><br>
      <small>Logo on event banners</small>
    </span>
  </label>

  <label>
    <input type="radio" name="tier" value="Supporter|5000">
    <span>
      <b>Supporter – ₹10,000</b><br>
      <small>Name on thank-you board</small>
    </span>
  </label>

  <label>
    <input type="radio" name="tier" value="Sports Partner|0">
    <span>
      <b>🏃 Sports Partner - ₹10,000</b><br>
      <small>Sports equipment, training or sports support</small>
    </span>
  </label>

  <label>
    <input type="radio" name="tier" value="Fitness Partner|0">
    <span>
      <b>💪 Fitness Partner - ₹10,000</b><br>
      <small>Fitness, gym or training support</small>
    </span>
  </label>

  <label>
    <input type="radio" name="tier" value="Radio Partner|0">
    <span>
      <b>📻 Radio Partner - ₹10,000</b><br>
      <small>Radio promotion and media support</small>
    </span>
  </label>

  <label>
    <input type="radio" name="tier" value="Hydration Partner|0">
    <span>
      <b>💧 Hydration Partner - ₹10,000</b><br>
      <small>Drinking water and hydration support</small>
    </span>
  </label>

  <label>
    <input type="radio" name="tier" value="Energy Partner|0">
    <span>
      <b>⚡ Energy Partner - ₹10,000</b><br>
      <small>Energy drinks, nutrition or refreshments</small>
    </span>
  </label>

  <label>
    <input type="radio" name="tier" value="Accessory Partner|0">
    <span>
      <b>🎒 Accessory Partner - ₹10,000</b><br>
      <small>Caps, bags, accessories or participant kits</small>
    </span>
  </label>

  <label>
    <input type="radio" name="tier" value="Organic Partner|0">
    <span>
      <b>🌱 Organic Partner - ₹10,000</b><br>
      <small>Organic, natural or eco-friendly products</small>
    </span>
  </label>

  <label>
    <input type="radio" name="tier" value="NGO Partner|0">
    <span>
      <b>🤝 NGO Partner - ₹10,000</b><br>
      <small>Social awareness and community support</small>
    </span>
  </label>

  <label>
    <input type="radio" name="tier" value="Medical Partner|0">
    <span>
      <b>🩺 Medical Partner - ₹10,000</b><br>
      <small>Medical team, first aid and emergency support</small>
    </span>
  </label>

  <label>
    <input type="radio" name="tier" value="Custom|0">
    <span>
      <b>Custom / In-kind Partner</b><br>
      <small>Water, medals, refreshments, equipment, services, etc.</small>
    </span>
  </label>

</div>
<label>Organisation / Name <i>*</i><input name="org_name" required></label>
<label>Contact person <i>*</i><input name="contact_name" required></label>
<label>Mobile <i>*</i><input name="mobile" type="tel" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" required></label>
<label>Email<input name="email" type="email"></label>
<label>Amount / what you will provide<input name="amount" type="number" min="0" placeholder="₹ (optional for in-kind)"></label>
<label>Message<textarea name="message" rows="3"></textarea></label>
<label>Payment proof (optional)<input name="proof" type="file" accept="image/*,application/pdf"></label>
<div id="err" class="err" role="alert"></div>
<button class="btn alt" id="go">Send sponsorship request</button>
</form>
<section id="done" class="card ok" hidden><h2>Thank you ✔</h2><p>Our team will call you within 24 hours. 9384280149 / 8122228155</p></section>
</main>
<script src="app.js"></script>
<script>
const f=document.getElementById("f"),err=document.getElementById("err"),go=document.getElementById("go");
f.addEventListener("submit",async e=>{
  e.preventDefault();err.textContent="";
  if(!f.checkValidity()){f.reportValidity();return}
  go.disabled=true;go.textContent="Sending...";
  try{
    const d=new FormData(f),[tier,def]=d.get("tier").split("|");
    const proof=await uploadFile(d.get("proof"),"sponsors");
    const {error}=await sb.from("sponsors").insert({org_name:d.get("org_name").trim(),contact_name:d.get("contact_name").trim(),
      mobile:d.get("mobile"),email:d.get("email")||null,tier,amount:d.get("amount")?+d.get("amount"):+def,message:d.get("message")||null,proof_url:proof});
    if(error)throw error;
    f.hidden=true;document.getElementById("done").hidden=false;scrollTo(0,0);
  }catch(x){err.textContent="Could not send: "+(x.message||x);go.disabled=false;go.textContent="Send sponsorship request"}
});
</script></body></html>
